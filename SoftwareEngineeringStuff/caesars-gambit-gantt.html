<style>
:root,[data-theme="light"]{
  --color-bg:#f7f6f2;--color-surface:#f9f8f5;--color-surface-2:#fbfbf9;
  --color-surface-offset:#f3f0ec;--color-border:#d4d1ca;--color-divider:#dcd9d5;
  --color-text:#28251d;--color-text-muted:#7a7974;--color-text-faint:#bab9b4;
  --color-primary:#01696f;--color-primary-hover:#0c4e54;
  --shadow-sm:0 1px 2px oklch(0.2 0.01 80 / 0.06);
  --shadow-md:0 4px 12px oklch(0.2 0.01 80 / 0.08);
  --radius-sm:0.375rem;--radius-md:0.5rem;--radius-lg:0.75rem;--radius-full:9999px;
  --font-body:'Satoshi',sans-serif;
  --space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;
  --space-6:1.5rem;--space-8:2rem;
}
[data-theme="dark"]{
  --color-bg:#171614;--color-surface:#1c1b19;--color-surface-2:#201f1d;
  --color-surface-offset:#22211f;--color-border:#393836;--color-divider:#262523;
  --color-text:#cdccca;--color-text-muted:#797876;--color-text-faint:#5a5957;
  --color-primary:#4f98a3;--color-primary-hover:#227f8b;
  --shadow-sm:0 1px 2px oklch(0 0 0 / 0.2);--shadow-md:0 4px 12px oklch(0 0 0 / 0.3);
}
@media(prefers-color-scheme:dark){:root:not([data-theme]){
  --color-bg:#171614;--color-surface:#1c1b19;--color-surface-2:#201f1d;
  --color-surface-offset:#22211f;--color-border:#393836;--color-divider:#262523;
  --color-text:#cdccca;--color-text-muted:#797876;--color-text-faint:#5a5957;
  --color-primary:#4f98a3;--color-primary-hover:#227f8b;
}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth;}
body{font-family:var(--font-body);background:var(--color-bg);color:var(--color-text);min-height:100dvh;font-size:clamp(0.875rem,0.8rem+0.35vw,1rem);}
/* Header */
.header{background:var(--color-surface);border-bottom:1px solid var(--color-border);padding:var(--space-4) var(--space-6);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm);}
.header-left{display:flex;align-items:center;gap:var(--space-3);}
.logo svg{display:block;}
.logo-text{font-size:1.1rem;font-weight:700;letter-spacing:-0.02em;}
.logo-sub{font-size:0.75rem;color:var(--color-text-muted);margin-top:1px;}
.header-right{display:flex;align-items:center;gap:var(--space-4);}
/* Legend */
.legend{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4);padding:var(--space-3) var(--space-6);background:var(--color-surface-2);border-bottom:1px solid var(--color-divider);}
.legend-item{display:flex;align-items:center;gap:var(--space-2);font-size:0.75rem;color:var(--color-text-muted);cursor:pointer;padding:2px var(--space-2);border-radius:var(--radius-full);transition:background 180ms;user-select:none;}
.legend-item:hover{background:var(--color-surface-offset);}
.legend-item.active{color:var(--color-text);font-weight:500;}
.legend-dot{width:10px;height:10px;border-radius:var(--radius-full);flex-shrink:0;}
/* Controls */
.controls{padding:var(--space-3) var(--space-6);display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap;background:var(--color-surface);border-bottom:1px solid var(--color-divider);}
.filter-group{display:flex;gap:var(--space-2);align-items:center;}
.filter-label{font-size:0.75rem;color:var(--color-text-muted);font-weight:500;text-transform:uppercase;letter-spacing:0.05em;}
.filter-btn{padding:4px 10px;border-radius:var(--radius-full);border:1px solid var(--color-border);background:transparent;color:var(--color-text-muted);font-size:0.75rem;cursor:pointer;font-family:inherit;transition:all 180ms;}
.filter-btn:hover,.filter-btn.active{background:var(--color-primary);border-color:var(--color-primary);color:#fff;}
.sep{width:1px;height:20px;background:var(--color-border);}
.view-toggle{display:flex;background:var(--color-surface-offset);border-radius:var(--radius-md);padding:2px;gap:2px;}
.view-btn{padding:4px 12px;border-radius:calc(var(--radius-md) - 2px);border:none;background:transparent;color:var(--color-text-muted);font-size:0.75rem;cursor:pointer;font-family:inherit;transition:all 180ms;}
.view-btn.active{background:var(--color-surface);color:var(--color-text);font-weight:500;box-shadow:var(--shadow-sm);}
/* Main Gantt */
.gantt-wrapper{padding:var(--space-4) var(--space-6);overflow-x:auto;}
.gantt-container{min-width:900px;}
/* Sprint headers */
.sprint-headers{display:grid;margin-left:220px;border-radius:var(--radius-md) var(--radius-md) 0 0;overflow:hidden;background:var(--color-surface);}
.sprint-header{padding:var(--space-2) var(--space-3);text-align:center;font-size:0.72rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;border-right:1px solid var(--color-border);}
.sprint-header:last-child{border-right:none;}
/* Timeline rows */
.gantt-body{background:var(--color-surface);border-radius:0 0 var(--radius-lg) var(--radius-lg);border:1px solid var(--color-border);border-top:none;}
.group-header{display:grid;grid-template-columns:220px 1fr;padding:var(--space-2) var(--space-3);background:var(--color-surface-offset);border-top:1px solid var(--color-divider);font-size:0.72rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-text-muted);position:sticky;left:0;}
.gantt-row{display:grid;grid-template-columns:220px 1fr;align-items:center;border-top:1px solid var(--color-divider);min-height:36px;transition:background 150ms;}
.gantt-row:hover{background:var(--color-surface-2);}
.row-label{padding:var(--space-2) var(--space-3);font-size:0.75rem;line-height:1.3;display:flex;align-items:center;gap:var(--space-2);color:var(--color-text);position:sticky;left:0;background:inherit;z-index:2;}
.row-label .icon{flex-shrink:0;font-size:0.8em;}
.row-label .key{font-size:0.65rem;color:var(--color-text-faint);font-weight:500;white-space:nowrap;}
.row-label .title-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;}
.row-timeline{position:relative;height:100%;min-height:36px;display:flex;align-items:center;}
/* Sprint column backgrounds */
.col-bg{position:absolute;top:0;bottom:0;opacity:0.04;}
.bar-track{position:absolute;inset:0;display:flex;align-items:center;padding:4px 0;}
.bar{height:18px;border-radius:var(--radius-full);position:absolute;display:flex;align-items:center;padding:0 8px;font-size:0.62rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default;transition:opacity 150ms,transform 150ms;opacity:0.92;box-shadow:0 1px 3px oklch(0 0 0 / 0.25);}
.bar:hover{opacity:1;transform:scaleY(1.1);z-index:10;}
.bar.bug{border-radius:3px;}
/* Status dot */
.status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-right:4px;}
/* Dark divider lines for sprint boundaries */
.sprint-line{position:absolute;top:0;bottom:0;width:1px;background:var(--color-border);z-index:1;}
/* Tooltip */
.tooltip{position:fixed;background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-3);max-width:280px;font-size:0.75rem;z-index:1000;pointer-events:none;opacity:0;transition:opacity 150ms;box-shadow:var(--shadow-md);line-height:1.5;}
.tooltip.visible{opacity:1;}
.tooltip-title{font-weight:600;color:var(--color-text);margin-bottom:4px;}
.tooltip-row{color:var(--color-text-muted);display:flex;gap:var(--space-2);}
.tooltip-row span:first-child{min-width:70px;color:var(--color-text-faint);}
/* Theme toggle */
.theme-btn{background:none;border:1px solid var(--color-border);border-radius:var(--radius-md);padding:6px 8px;cursor:pointer;color:var(--color-text-muted);display:flex;align-items:center;transition:all 180ms;}
.theme-btn:hover{background:var(--color-surface-offset);color:var(--color-text);}
/* Stats bar */
.stats{display:flex;gap:var(--space-6);padding:var(--space-3) var(--space-6);background:var(--color-surface-2);border-bottom:1px solid var(--color-divider);}
.stat{display:flex;flex-direction:column;gap:2px;}
.stat-val{font-size:1.3rem;font-weight:700;line-height:1;color:var(--color-primary);}
.stat-label{font-size:0.7rem;color:var(--color-text-faint);text-transform:uppercase;letter-spacing:0.05em;}
</style>
</head>

con": "🐛", "sprint": 5, "start": "2026-05-11", "end": "2026-06-01", "sp": "nan"}, {"key": "SCRUM-49", "title": "alle css dateien loswerden (bis auf global.css) -> v...", "type": "Story", "status": "Zu erledigen", "category": "Web UI", "group": "Frontend", "color": "#5591c7", "icon": "🖥️", "sprint": 5, "start": "2026-05-11", "end": "2026-06-01", "sp": "nan"}, {"key": "SCRUM-62", "title": "Paterno und Harion sind nicht benachbart", "type": "Bug", "status": "Zu erledigen", "category": "Game UI – Bug", "group": "Frontend", "color": "#d163a7", "icon": "🐛", "sprint": 5, "start": "2026-05-11", "end": "2026-06-01", "sp": "nan"}, {"key": "SCRUM-63", "title": "Raumlink kopieren Button in Lobby geht nicht", "type": "Bug", "status": "Zu erledigen", "category": "Game UI – Bug", "group": "Frontend", "color": "#d163a7", "icon": "🐛", "sprint": 5, "start": "2026-05-11", "end": "2026-06-01", "sp": "nan"}, {"key": "SCRUM-64", "title": "Slider hinzufügen beim truppen auswählen", "type": "Bug", "status": "Zu erledigen", "category": "Game UI – Bug", "group": "Frontend", "color": "#d163a7", "icon": "🐛", "sprint": 5, "start": "2026-05-11", "end": "2026-06-01", "sp": "nan"}, {"key": "SCRUM-66", "title": "Backend Tests", "type": "Epic", "status": "Zu erledigen", "category": "Backend – Test", "group": "Backend", "color": "#6daa45", "icon": "🧪", "sprint": 5, "start": "2026-06-01", "end": "2026-06-01", "sp": "nan"}, {"key": "SCRUM-67", "title": "Backend Gamelogic", "type": "Epic", "status": "Zu erledigen", "category": "Game UI", "group": "Frontend", "color": "#a86fdf", "icon": "🎮", "sprint": 5, "start": "2026-06-01", "end": "2026-06-01", "sp": "nan"}];

const SPRINTS = [
  {nr:2, label:'Sprint 2', start:'2026-03-16', end:'2026-03-29', color:'#4f98a3'},
  {nr:3, label:'Sprint 3', start:'2026-03-30', end:'2026-04-19', color:'#a86fdf'},
  {nr:4, label:'Sprint 4', start:'2026-04-20', end:'2026-05-10', color:'#fdab43'},
  {nr:5, label:'Sprint 5', start:'2026-05-11', end:'2026-06-01', color:'#6daa45'},
];

const GROUP_ORDER = ['Backend', 'Frontend', 'Auth & Infra', 'Sonstiges'];
const CAT_ORDER = [
  'Backend – Logik','Backend – Bug','Backend – Test',
  'Web UI','Web UI – Bug','Game UI','Game UI – Bug','Frontend – Test',
  'Auth','Auth – Bug','Sonstiges','Epic'
];

const GANTT_START = new Date('2026-03-16');
const GANTT_END   = new Date('2026-06-01');
const TOTAL_DAYS  = (GANTT_END - GANTT_START) / 86400000;

function dayOffset(dateStr) {
  return (new Date(dateStr) - GANTT_START) / 86400000;
}
function pct(days) { return (days / TOTAL_DAYS * 100).toFixed(3) + '%'; }

let activeFilters = { sprint: null, group: null };
let activeCategories = new Set(ISSUES.map(i => i.category));

function filterIssues() {
  return ISSUES.filter(i => {
    if (activeFilters.sprint && i.sprint !== activeFilters.sprint) return false;
    if (activeFilters.group && i.group !== activeFilters.group) return false;
    if (!activeCategories.has(i.category)) return false;
    return true;
  });
}

function renderStats(issues) {
  const total = issues.length;
  const done = issues.filter(i => i.status === 'Fertig').length;
  const bugs = issues.filter(i => i.type === 'Bug').length;
  const stories = issues.filter(i => i.type === 'Story').length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><div class="stat-val">${total}</div><div class="stat-label">Gesamt</div></div>
    <div class="stat"><div class="stat-val">${done}</div><div class="stat-label">Fertig</div></div>
    <div class="stat"><div class="stat-val" style="color:#dd6974">${bugs}</div><div class="stat-label">Bugs</div></div>
    <div class="stat"><div class="stat-val" style="color:#5591c7">${stories}</div><div class="stat-label">Stories</div></div>
    <div class="stat"><div class="stat-val" style="color:#6daa45">${Math.round(done/total*100)}%</div><div class="stat-label">Done Rate</div></div>
  `;
}

function renderControls() {
  const sprintBtns = SPRINTS.map(s =>
    `<button class="filter-btn ${activeFilters.sprint===s.nr?'active':''}" onclick="setSprintFilter(${s.nr})">${s.label}</button>`
  ).join('');
  const groupBtns = GROUP_ORDER.map(g =>
    `<button class="filter-btn ${activeFilters.group===g?'active':''}" onclick="setGroupFilter('${g}')">${g}</button>`
  ).join('');
  document.getElementById('controls').innerHTML = `
    <div class="filter-group">
      <span class="filter-label">Sprint</span>
      <button class="filter-btn ${!activeFilters.sprint?'active':''}" onclick="setSprintFilter(null)">Alle</button>
      ${sprintBtns}
    </div>
    <div class="sep"></div>
    <div class="filter-group">
      <span class="filter-label">Gruppe</span>
      <button class="filter-btn ${!activeFilters.group?'active':''}" onclick="setGroupFilter(null)">Alle</button>
      ${groupBtns}
    </div>
  `;
}

function renderLegend() {
  const catColors = {};
  ISSUES.forEach(i => { catColors[i.category] = i.color; });
  const items = CAT_ORDER.filter(c => catColors[c]).map(c => {
    const active = activeCategories.has(c);
    return `<div class="legend-item ${active?'active':''}" onclick="toggleCat('${c.replace(/'/g,"\\'")}')">
      <div class="legend-dot" style="background:${active?catColors[c]:'var(--color-text-faint)'}"></div>
      ${c}
    </div>`;
  }).join('');
  document.getElementById('legend').innerHTML = items;
}

function renderGantt(issues) {
  const container = document.getElementById('gantt');

  // Sprint header
  const sprintHeaderCols = SPRINTS.map(s => {
    const days = (new Date(s.end) - new Date(s.start)) / 86400000;
    const flex = (days / TOTAL_DAYS * 100).toFixed(2);
    return `<div class="sprint-header" style="flex:${flex};background:${s.color}22;color:${s.color}">${s.label}</div>`;
  }).join('');

  // Group issues
  const grouped = {};
  GROUP_ORDER.forEach(g => grouped[g] = []);
  issues.forEach(i => {
    if (grouped[i.group]) grouped[i.group].push(i);
    else grouped['Sonstiges'].push(i);
  });

  let rowsHTML = '';
  GROUP_ORDER.forEach(gname => {
    const gissues = grouped[gname];
    if (!gissues.length) return;

    // Sort by category then sprint
    gissues.sort((a,b) => {
      const ci = CAT_ORDER.indexOf(a.category) - CAT_ORDER.indexOf(b.category);
      return ci !== 0 ? ci : a.sprint - b.sprint;
    });

    rowsHTML += `<div class="group-header">
      <div>${gname}</div>
      <div style="font-size:0.65rem;color:var(--color-text-faint);padding-top:1px;">${gissues.length} Issues</div>
    </div>`;

    gissues.forEach(issue => {
      const startPct = pct(dayOffset(issue.start));
      const widthPct = pct(Math.max(0.5, dayOffset(issue.end) - dayOffset(issue.start)));
      const isBug = issue.type === 'Bug';
      const isDone = issue.status === 'Fertig';
      const statusColor = isDone ? '#6daa45' : '#fdab43';

      // Sprint lines
      const sprintLines = SPRINTS.slice(1).map(s => {
        const lp = pct(dayOffset(s.start));
        return `<div class="sprint-line" style="left:${lp}"></div>`;
      }).join('');

      rowsHTML += `<div class="gantt-row" data-key="${issue.key}">
        <div class="row-label">
          <span class="icon">${issue.icon}</span>
          <div style="min-width:0;flex:1">
            <div style="display:flex;align-items:center;gap:4px;">
              <div class="status-dot" style="background:${statusColor}"></div>
              <span class="key">${issue.key}</span>
            </div>
            <div class="title-text" title="${issue.title.replace(/"/g,'&quot;')}">${issue.title}</div>
          </div>
        </div>
        <div class="row-timeline">
          ${sprintLines}
          <div class="bar-track" style="position:absolute;inset:0;">
            <div class="bar ${isBug?'bug':''}"
              style="left:${startPct};width:${widthPct};background:${issue.color};"
              data-issue='${JSON.stringify(issue).replace(/'/g,"&#39;")}'
              onmouseenter="showTooltip(event,this)"
              onmouseleave="hideTooltip()"
            >${issue.key}</div>
          </div>
        </div>
      </div>`;
    });
  });

  container.innerHTML = `
    <div class="sprint-headers" style="display:flex">${sprintHeaderCols}</div>
    <div class="gantt-body">${rowsHTML}</div>
  `;
}

function showTooltip(e, el) {
  const issue = JSON.parse(el.getAttribute('data-issue'));
  const tt = document.getElementById('tooltip');
  tt.innerHTML = `
    <div class="tooltip-title">${el.closest('.gantt-row').querySelector('.title-text').textContent}</div>
    <div class="tooltip-row"><span>Key</span><span>${issue.key}</span></div>
    <div class="tooltip-row"><span>Typ</span><span>${issue.type}</span></div>
    <div class="tooltip-row"><span>Kategorie</span><span>${issue.category}</span></div>
    <div class="tooltip-row"><span>Sprint</span><span>Sprint ${issue.sprint}</span></div>
    <div class="tooltip-row"><span>Status</span><span>${issue.status}</span></div>
    <div class="tooltip-row"><span>Story Points</span><span>${issue.sp !== 'nan' ? issue.sp : '–'}</span></div>
    <div class="tooltip-row"><span>Start</span><span>${issue.start}</span></div>
    <div class="tooltip-row"><span>Ende</span><span>${issue.end}</span></div>
  `;
  tt.classList.add('visible');
  posTooltip(e);
}
function posTooltip(e) {
  const tt = document.getElementById('tooltip');
  let x = e.clientX + 12, y = e.clientY + 12;
  if (x + 290 > window.innerWidth) x = e.clientX - 290;
  if (y + 200 > window.innerHeight) y = e.clientY - 200;
  tt.style.left = x + 'px';
  tt.style.top = y + 'px';
}
function hideTooltip() { document.getElementById('tooltip').classList.remove('visible'); }
document.addEventListener('mousemove', e => { if (document.getElementById('tooltip').classList.contains('visible')) posTooltip(e); });

function setSprintFilter(nr) {
  activeFilters.sprint = activeFilters.sprint === nr ? null : nr;
  render();
}
function setGroupFilter(g) {
  activeFilters.group = activeFilters.group === g ? null : g;
  render();
}
function toggleCat(cat) {
  if (activeCategories.has(cat)) activeCategories.delete(cat);
  else activeCategories.add(cat);
  render();
}

function render() {
  const issues = filterIssues();
  renderStats(issues);
  renderControls();
  renderLegend();
  renderGantt(issues);
}

// Theme toggle
(function(){
  const t = document.querySelector('[data-theme-toggle]');
  const r = document.documentElement;
  let d = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
  r.setAttribute('data-theme', d);
  if (t) t.addEventListener('click', () => {
    d = d === 'dark' ? 'light' : 'dark';
    r.setAttribute('data-theme', d);
    t.innerHTML = d === 'dark'
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
  });
})();

render();
</script>
